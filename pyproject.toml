[project]
name = "gemini-file-search-api"
version = "0.1.0"
description = "FastAPI wrapper around Gemini File Search stores"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
# FastAPI declares dependencies and form fields as call defaults.
ignore = ["B008"]
